[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtg-deck-analyzer"
version = "0.1.0"
description = "Analiza decks de Magic: The Gathering (Commander/EDH) y propone mejoras con ayuda de Claude."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
analyze = "analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
